name: Stock Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 5-22 * * 1-5' # Every hour from 07:00 to 23:00 Vilnius time, Monday to Friday

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npx playwright install --with-deps

      - name: Run stock scan test (capture output regardless of result)
        id: run_test
        run: |
          set +e
          npx playwright test tests/scan-stock.spec.js --reporter=line
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV
          if [ $EXIT_CODE -eq 0 ]; then echo "STATUS=SUCCESS" >> $GITHUB_ENV; else echo "STATUS=FAILURE" >> $GITHUB_ENV; fi
          # Create a concise summary file
          echo "Stock scan completed with status: $STATUS" > summary.txt
          echo "Total cards and clickable cards are in scan-results.txt" >> summary.txt
          # Only include scan-results.txt and scan-diff.txt in scan-output.txt for email body
          cp scan-results.txt scan-output.txt
          echo "\nItem changes:" >> scan-output.txt
          cat scan-diff.txt >> scan-output.txt

      - name: Prepare email subject
        run: |
          if [ "$STATUS" = "SUCCESS" ]; then
            echo "MAIL_SUBJECT=Stock Scan Results: SUCCESS" >> $GITHUB_ENV
          else
            echo "MAIL_SUBJECT=Stock Scan Results: FAILURE" >> $GITHUB_ENV
          fi

      - name: Install jq (for JSON parsing)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Fetch previous scan-items artifact (cross-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Listing artifacts to find previous last-scan-items..."
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" > artifacts.json
          ARTIFACT_ID=$(jq -r '.artifacts | map(select(.name=="last-scan-items")) | sort_by(.created_at) | reverse | .[0].id // empty' artifacts.json)
          if [ -n "$ARTIFACT_ID" ]; then
            echo "Found artifact id: $ARTIFACT_ID"
            curl -L -H "Authorization: Bearer $GH_TOKEN" -o last-scan-items.zip \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip"
            mkdir -p last-scan-items
            unzip -q last-scan-items.zip -d last-scan-items
            ls -R last-scan-items || true
          else
            echo "No previous artifact found; treating as first run."
          fi

      - name: Generate diff (scan-diff.txt)
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const prevPath = 'last-scan-items/scan-items.json';
          const currPath = 'scan-items.json';
          const load = p => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p,'utf8')) : [];
          const prev = load(prevPath); const curr = load(currPath);
          const pSet = new Set(prev.map(i=>i.name)); const cSet = new Set(curr.map(i=>i.name));
          const added = [...cSet].filter(n=>!pSet.has(n));
          const removed = [...pSet].filter(n=>!cSet.has(n));
          let summary='';
          if (added.length) summary += `Added items (${added.length}):\n` + added.map(n=>`+ ${n}`).join('\n') + '\n';
          if (removed.length) summary += `Removed items (${removed.length}):\n` + removed.map(n=>`- ${n}`).join('\n') + '\n';
          if (!summary) summary = 'No changes in items.';
          fs.writeFileSync('scan-diff.txt', summary);
          EOF

      - name: Compare scan-items.json to previous
        id: compare_items
        run: |
          if [ -f scan-diff.txt ]; then
            if grep -q "No changes in items." scan-diff.txt; then
              echo "NO_CHANGES=true" >> $GITHUB_ENV
            else
              echo "NO_CHANGES=false" >> $GITHUB_ENV
            fi
          else
            echo "NO_CHANGES=false" >> $GITHUB_ENV
          fi

      - name: Send email with results
        if: env.NO_CHANGES == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ env.MAIL_SUBJECT }}
          from: Stock Scanner <${{ secrets.SMTP_USERNAME }}>
          to: tautvydas.ankenas@gmail.com
          body: file://scan-output.txt
          attachments: summary.txt, scan-output.txt, scan-results.txt

      - name: Upload new scan-items.json for next run
        uses: actions/upload-artifact@v4
        with:
          name: last-scan-items
          path: scan-items.json

      - name: Upload artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-scan-results
          path: |
            scan-output.txt
            summary.txt
            playwright-report

    outputs:
      status: ${{ env.STATUS }}
